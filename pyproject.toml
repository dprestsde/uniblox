[project]
name = "uniblox-checkout"
version = "0.1.0"
description = "Checkout and rewards service foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["ruff>=0.13,<1"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/store/migrations", "src/fake_payments/migrations"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
